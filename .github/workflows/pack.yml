name: Pack Docker Images

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. 强制注销所有登录凭证，确保全局纯匿名访问
      - name: Force Anonymous Mode
        run: |
          docker logout ghcr.io || true
          docker logout docker.io || true

      # 2. 纯匿名方式拉取 Docker Hub 与 GHCR 镜像
      - name: Pull Images Anonymously
        run: |
          docker pull ghcr.io/home-assistant/home-assistant:stable
          docker pull rhasspy/wyoming-faster-whisper:latest || docker pull rhasspy/wyoming-whisper:latest
          
          # 匿名动态获取 xiasi0/wyoming-sherpa-onnx 镜像
          TAG=$(curl -s https://api.github.com/users/xiasi0/packages/container/wyoming-sherpa-onnx/versions | grep -o '"tags":\["[^"]*' | head -n 1 | cut -d'"' -f4 || echo "main")
          docker pull ghcr.io/xiasi0/wyoming-sherpa-onnx:$TAG || docker pull ghcr.io/xiasi0/wyoming-sherpa-onnx:main || true

      # 3. 打包镜像
      - name: Save Docker Images
        run: |
          IMAGES=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep -v "<none>")
          echo "打包以下镜像："
          echo "$IMAGES"
          docker save $IMAGES -o cinema-images.tar

      # 4. 发布到 Release
      - name: Delete Old Release
        run: gh release delete v1.0.0 --yes || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.0
          files: cinema-images.tar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
