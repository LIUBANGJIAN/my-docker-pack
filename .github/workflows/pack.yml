name: Pack Docker Images

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    steps:
      # 1. 登录 GHCR 获得访问权限
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 2. 动态查询 xiasi0/wyoming-sherpa-onnx 的实际最新 Tag 并拉取
      - name: Pull All Images
        run: |
          docker pull ghcr.io/home-assistant/home-assistant:stable
          docker pull rhasspy/wyoming-faster-whisper:latest

          # 获取 xiasi0/wyoming-sherpa-onnx 的最新版本 tag
          TAG=$(gh api /users/xiasi0/packages/container/wyoming-sherpa-onnx/versions --jq '.[0].metadata.container.tags[0]' 2>/dev/null || echo "main")
          echo "检测到 sherpa-onnx 的有效 Tag: $TAG"
          
          # 尝试拉取解析出的 Tag，若失败则尝试常规备用 Tag
          docker pull ghcr.io/xiasi0/wyoming-sherpa-onnx:$TAG || \
          docker pull ghcr.io/xiasi0/wyoming-sherpa-onnx:master || \
          docker pull ghcr.io/xiasi0/wyoming-sherpa-onnx:main || true

      # 3. 自动匹配所有已成功拉取的镜像打包
      - name: Save Docker Images
        run: |
          IMAGES=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep -v "<none>")
          echo "正在打包以下镜像："
          echo "$IMAGES"
          docker save $IMAGES -o cinema-images.tar

      # 4. 发布到 Release 提供下载
      - name: Delete Old Release
        run: gh release delete v1.0.0 --yes || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.0
          files: cinema-images.tar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
