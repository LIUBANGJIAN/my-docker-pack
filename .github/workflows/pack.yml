name: Pack Docker Images

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    steps:
      # 1. 登录 GHCR 准备拉取 GitHub 镜像
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 2. 从各自正确的源拉取镜像
      - name: Pull All Correct Images
        run: |
          docker pull ghcr.io/home-assistant/home-assistant:stable
          docker pull ghcr.io/xiasi0/wyoming-sherpa-onnx:latest
          docker pull rhasspy/wyoming-faster-whisper:latest

      # 3. 将 3 个镜像打包为一个离线文件
      - name: Save Docker Images
        run: |
          docker save \
            ghcr.io/home-assistant/home-assistant:stable \
            ghcr.io/xiasi0/wyoming-sherpa-onnx:latest \
            rhasspy/wyoming-faster-whisper:latest \
            -o cinema-images.tar

      # 4. 清理旧 Release 并发布新离线包
      - name: Delete Old Release
        run: gh release delete v1.0.0 --yes || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.0
          files: cinema-images.tar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
