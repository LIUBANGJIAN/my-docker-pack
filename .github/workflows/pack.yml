name: Pack Docker Images

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    steps:
      # 1. 优先登录 GHCR 保证拉取权限
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 2. 全程从 GHCR 拉取确切路径的官方镜像
      - name: Pull All Images from GHCR
        run: |
          docker pull ghcr.io/home-assistant/home-assistant:stable
          docker pull ghcr.io/rhasspy/wyoming-sherpa-onnx:latest
          docker pull ghcr.io/rhasspy/wyoming-whisper:latest

      # 3. 打包导出为离线文件
      - name: Save Docker Images
        run: |
          docker save \
            ghcr.io/home-assistant/home-assistant:stable \
            ghcr.io/rhasspy/wyoming-sherpa-onnx:latest \
            ghcr.io/rhasspy/wyoming-whisper:latest \
            -o cinema-images.tar

      # 4. 发布到 Release 提供网页下载
      - name: Delete Old Release
        run: gh release delete v1.0.0 --yes || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.0
          files: cinema-images.tar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
