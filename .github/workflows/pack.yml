name: Pack Docker Images

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    steps:
      # 1. 登录 GHCR 准备拉取 GitHub 镜像
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 2. 依次拉取 3 个官方确切镜像（彻底消除 manifest unknown 和 denied 报错）
      - name: Pull Official Images
        run: |
          docker pull ghcr.io/home-assistant/home-assistant:stable
          docker pull ghcr.io/rhasspy/wyoming-sherpa-onnx:latest || docker pull ghcr.io/rhasspy/wyoming-sherpa-onnx:master || true
          docker pull ghcr.io/rhasspy/wyoming-whisper:latest

      # 3. 自动匹配并打成单个离线 tar 包
      - name: Save Docker Images to Single Archive
        run: |
          # 自动获取拉到的 3 个镜像名称
          HA_IMG="ghcr.io/home-assistant/home-assistant:stable"
          SHERPA_IMG=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep wyoming-sherpa-onnx | head -n 1)
          WHISPER_IMG="ghcr.io/rhasspy/wyoming-whisper:latest"
          
          # 打包
          docker save $HA_IMG $SHERPA_IMG $WHISPER_IMG -o cinema-images.tar

      # 4. 删除旧的 Release 记录（防止覆盖冲突）
      - name: Delete Old Release
        run: gh release delete v1.0.0 --yes || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 5. 上传导出的 tar 文件到 Release 供网页直接下载
      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.0
          files: cinema-images.tar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
