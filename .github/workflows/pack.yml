name: Pack Docker Images

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and Save Images
        run: |
          docker pull ghcr.io/home-assistant/home-assistant:stable
          
          # 尝试拉取 sherpa-onnx（如果不确定 tag，可以尝试不用 tag，或者明确指定版本）
          docker pull ghcr.io/rhasspy/wyoming-sherpa-onnx || docker pull ghcr.io/rhasspy/wyoming-sherpa-onnx:1.0.0 || true
          
          docker pull rhasspy/wyoming-faster-whisper:latest
          
          # 打包已成功拉取的镜像（自动匹配本地已有的 sherpa-onnx 完整名称）
          SHERPA_IMG=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep wyoming-sherpa-onnx | head -n 1)
          
          docker save ghcr.io/home-assistant/home-assistant:stable $SHERPA_IMG rhasspy/wyoming-faster-whisper:latest -o cinema-images.tar

      - name: Delete Old Release
        run: gh release delete v1.0.0 --yes || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.0
          files: cinema-images.tar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
