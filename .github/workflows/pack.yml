name: Pack Docker Images

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取仓库代码（读取 images.txt）
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 清理登录凭证，切换至纯匿名模式
      - name: Force Anonymous Mode
        run: |
          docker logout ghcr.io || true
          docker logout docker.io || true

      # 3. 读取 images.txt，逐个拉取、导出为 .tar 并打成 .zip
      - name: Process and Package Images
        run: |
          mkdir -p output

          # 逐行读取 images.txt，忽略空行和以 # 开头的注释
          grep -v '^#' images.txt | grep -v '^\s*$' | while read -r RAW_IMAGE; do
            # 清理空格
            IMAGE=$(echo "$RAW_IMAGE" | xargs)
            echo "--------------------------------------------------"
            echo "正在处理镜像: $IMAGE"

            # 1. 尝试拉取镜像
            if ! docker pull "$IMAGE"; then
              echo "错误: 镜像 $IMAGE 拉取失败，跳过该镜像！"
              continue
            fi

            # 2. 提取镜像名称生成合法的文件名（如 ghcr.io/a/b:v1 -> ghcr.io-a-b-v1）
            SAFE_NAME=$(echo "$IMAGE" | sed 's/[^a-zA-Z0-9._-]/_/g')
            TAR_FILE="${SAFE_NAME}.tar"
            ZIP_FILE="output/${SAFE_NAME}.zip"

            # 3. 导出并压缩
            echo "正在导出为 $TAR_FILE ..."
            docker save "$IMAGE" -o "$TAR_FILE"

            echo "正在压缩为 $ZIP_FILE ..."
            zip -j "$ZIP_FILE" "$TAR_FILE"
            rm -f "$TAR_FILE"
          done

      # 4. 自动匹配 output 目录下的所有 ZIP，分别上传为独立的 Artifact
      - name: Upload Image Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: docker-images-zip-bundle
          path: output/*.zip
          retention-days: 7
