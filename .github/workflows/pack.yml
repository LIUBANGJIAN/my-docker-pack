name: Pack Docker Images

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    steps:
      # 1. 匿名拉取 Docker Hub 的公开镜像
      - name: Pull Docker Hub Image
        run: |
          docker pull rhasspy/wyoming-faster-whisper:latest

      # 2. 登录 GHCR 准备拉取 GitHub 镜像
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3. 使用 GHCR 的明确版本 tag 拉取
      - name: Pull GHCR Images
        run: |
          docker pull ghcr.io/home-assistant/home-assistant:stable
          docker pull ghcr.io/rhasspy/wyoming-sherpa-onnx:1.0.0 || docker pull ghcr.io/rhasspy/wyoming-sherpa-onnx:latest

      # 4. 动态打包所有已拉取镜像
      - name: Save Docker Images
        run: |
          docker save \
            ghcr.io/home-assistant/home-assistant:stable \
            rhasspy/wyoming-faster-whisper:latest \
            $(docker images --format "{{.Repository}}:{{.Tag}}" | grep wyoming-sherpa-onnx) \
            -o cinema-images.tar

      # 5. 清理旧 Release 并发布新文件
      - name: Delete Old Release
        run: gh release delete v1.0.0 --yes || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.0
          files: cinema-images.tar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
