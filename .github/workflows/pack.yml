name: Pack Docker Images

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    steps:
      # 1. 匿名拉取 Docker Hub 上的 Rhasspy 镜像
      - name: Pull Docker Hub Images
        run: |
          docker pull rhasspy/wyoming-sherpa-onnx:latest
          docker pull rhasspy/wyoming-faster-whisper:latest

      # 2. 登录 GHCR 拉取 Home Assistant 镜像
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull GHCR Images
        run: |
          docker pull ghcr.io/home-assistant/home-assistant:stable

      # 3. 将 3 个正确的镜像打包为 cinema-images.tar
      - name: Save Docker Images
        run: |
          docker save \
            ghcr.io/home-assistant/home-assistant:stable \
            rhasspy/wyoming-sherpa-onnx:latest \
            rhasspy/wyoming-faster-whisper:latest \
            -o cinema-images.tar

      # 4. 删除旧 Release 并发布新离线包
      - name: Delete Old Release
        run: gh release delete v1.0.0 --yes || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.0
          files: cinema-images.tar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
